[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi-sentinel"
version = "0.1.0"
description = "Query, troubleshoot and inventory a UniFi Network controller"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jeff Holst"},
    {name = "Eric Fitzgerald"}
]
keywords = ["unifi", "network", "export", "csv", "ubiquiti"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/jeffholst/unifi-sentinel"
Issues = "https://github.com/jeffholst/unifi-sentinel/issues"

[project.scripts]
unifi-sentinel = "unifi_sentinel.cli:main"

[tool.setuptools]
packages = ["unifi_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
