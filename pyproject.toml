[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-probe"
dynamic = ["version"]
description = "Probe a homelab: query, troubleshoot and inventory a UniFi Network controller"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jeff Holst"},
    {name = "Eric Fitzgerald"}
]
keywords = ["homelab", "unifi", "ubiquiti", "network", "monitoring", "troubleshooting", "inventory", "diagnostics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The web interface (`hlp serve`). The command line needs none of it: nothing in the core imports these.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "coverage>=7.6",
    "httpx2>=2.13",           # what Starlette's TestClient (FastAPI) uses; plain httpx is deprecated there
    "jsonschema>=4.25.1",
    "mypy>=2.3.1",
    "pytest>=8.0",
    "PyYAML>=6.0.2",
    "ruff>=0.16.9",
    "types-requests>=2.33.0.20260906",
]

[project.urls]
Homepage = "https://github.com/jeffholst/homelab-probe"
Issues = "https://github.com/jeffholst/homelab-probe/issues"

[project.scripts]
hlp = "homelab_probe.cli:main"

[tool.setuptools.dynamic]
version = {attr = "homelab_probe.__version__"}   # the one place the version is written

[tool.setuptools.packages.find]
include = ["homelab_probe*"]

[tool.setuptools.package-data]
"homelab_probe.demo" = ["controller.json"]     # the synthetic controller that --demo serves

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tools"]
# Tests marked live read a real controller; they run only when asked for: uv run pytest -m live
addopts = "-m 'not live'"
markers = ["live: reads a real controller (GET only; credentials from the environment or ./.env); opt in with -m live"]

[tool.coverage.run]
branch = true
source = ["homelab_probe"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "snapshots"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = [
    # Type-annotation modernisation (List[...] -> list[...], Optional[X] -> X | None) is
    # deliberately not applied in one sweep; do it per module when the file is touched.
    "UP006", "UP035", "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Test data (fixtures inline, long expected strings) reads better unwrapped.
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["homelab_probe"]

[tool.mypy]
files = ["homelab_probe"]
warn_unused_configs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
