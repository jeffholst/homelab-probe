# Publishes a GitHub release when the owner pushes a version tag (git tag -a v0.3.0 && git push origin v0.3.0).
#
# It never runs on a pull request or a push to a branch, it is the only workflow that can write to the repository
# (`contents: write`, on its one job), and it uses no third-party publishing action: the release is made with the `gh`
# CLI that the runner already has. Before anything is published it checks that the tag is `v` plus the package version and
# that CHANGELOG.md has a dated entry for it (tools/release_notes.py), and it runs the lockfile check and the tests.
# See "Releases" in AGENTS.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Install
        run: uv sync --locked --extra web
      - name: The tag, the package version and the changelog agree
        run: uv run python tools/release_notes.py "$TAG" > release-notes.md
      - name: Tests
        run: uv run pytest -q
      - name: Build the wheel and the source distribution
        run: uv build
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file release-notes.md
