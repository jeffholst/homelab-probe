name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Install (with the web extra, which the server tests need)
        run: uv sync --locked --extra web
      - name: Tests
        run: uv run pytest -q

  base-install:
    name: Tests (command line only, no web extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.10"
      - name: Install the base package and the dev tools only
        run: uv sync --locked
      - name: The command line works without FastAPI (the server tests skip themselves)
        run: uv run pytest -q

  coverage:
    name: Coverage (100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Fish and zsh, which the completion tests run for real (they skip without them)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fish zsh
      - run: uv sync --locked --extra web
      - name: Tests, with line and branch coverage
        run: uv run coverage run -m pytest -q
      - name: Every line and branch is covered
        run: uv run coverage report

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra web
      - run: uv run ruff check .

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra web
      - run: uv run mypy
