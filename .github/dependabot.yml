# Weekly dependency updates, one pull request per ecosystem (not one per package).
#
# Dependabot pull requests follow the same rules as any other: CI must pass (tests on Python 3.10 to 3.13, ruff,
# mypy, `uv lock --check`) and nothing is merged until the owner asks. See "Git and GitHub" in AGENTS.md.
version: 2

updates:
  # The actions used by .github/workflows/ci.yml. They are pinned to exact tags (astral-sh/setup-uv publishes only
  # exact versions, there is no floating v10), so without this they go stale silently.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # The Python dependencies in pyproject.toml, resolved into the committed uv.lock (runtime and the dev group).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # The web interface's packages (web/package.json, locked by web/package-lock.json). npm is separate from the uv and
  # actions entries because it needs the Node toolchain: its pull requests run the `web` job of ci.yml.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # The base images of the Dockerfile (python:3.13-slim, used by two of its stages). The compose file only builds that
  # Dockerfile, so it has no image of its own to keep current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "docker"
