# Copy to unifi-sentinel.toml (git-ignored: it may name your devices) to tune `diagnose`.
# It is read from the current directory, or pass --config FILE.

# Every value is optional; these are the defaults.
[thresholds]
resource_warn_pct = 90       # CPU or memory at or above this: warning
resource_critical_pct = 98   # CPU or memory at or above this: critical
storage_warn_pct = 90        # a device's storage (the gateway's) used at or above this: warning
storage_critical_pct = 98    # ... and this: critical
recent_reboot_minutes = 60   # a device up for less than this many minutes: info (it restarted recently)
slow_link_mbps = 100         # ports negotiated at or below this speed: info
wan_latency_warn_ms = 100    # internet latency at or above this: warning
wan_drops_warn = 10          # internet drops at or above this: warning (heuristic)
link_flap_count = 5          # port link-down count since boot at or above this: warning
port_drop_pct = 0.1          # dropped packets, % of a port's packets, at or above this: warning
min_packets_for_drop_pct = 1000 # minimum packets before evaluating drop percentage
poe_warn_pct = 80            # switch PoE budget used at or above this: warning
poe_critical_pct = 95        # switch PoE budget used at or above this: critical
wan_availability_warn_pct = 99   # 24h internet availability below this (%): warning
wan_speed_drop_pct = 70      # last speedtest download below this % of the 30-day median: warning
event_flap_count = 10        # disconnects (or unreachable events) in the window at or above this: warning
wifi_weak_signal_dbm = -75   # Wi-Fi client signal at or below this (dBm): warning
wifi_retry_pct = 30          # client or radio TX retries at or above this (%): warning
wifi_min_attempts = 1000     # client TX attempts needed before its retries are judged
wifi_satisfaction_warn = 50  # client or radio satisfaction below this (%): warning
radio_util_warn_pct = 70     # AP radio channel utilization at or above this: warning
radio_util_critical_pct = 90 # AP radio channel utilization at or above this: critical
reserved_offline_warn_days = 1      # a client with a DHCP reservation offline this many days: warning
reserved_offline_critical_days = 7  # ... and this many days: critical
notify_repeat_hours = 24           # `diagnose --notify` repeats a critical finding this often (0: never)

# Suppress findings you have accepted. Each rule needs a reason, plus a code,
# a subject and/or a message; every field that is given must match.
# code: a finding code, matched exactly (no wildcards, case-sensitive). It keeps
#   working when the wording changes. Find it with `diagnose --json` or
#   `diagnose --show-ignored`; an unknown code is an error that lists the valid ones.
# subject: case-insensitive name, * and ? wildcards.
# message: case-insensitive substring.
# until: optional last day the rule applies (inclusive), written 2026-12-31. After that
#   day the rule stops matching, so its findings come back and a warning on stderr
#   names the stale rule; delete it or give it a later date. Use it for a temporary ignore.
# Ignored findings are counted in the summary, excluded from exit codes and
# notifications, and listed with `diagnose --show-ignored`. `audit` reads the
# same rules (and its audit.* codes).

[[ignore]]
subject = "Garage AP"
message = "offline"
reason = "spare AP, kept unplugged on purpose"

[[ignore]]
code = "port.slow_link"
subject = "* port 2"
reason = "printer only supports 100 Mbps"

[[ignore]]
code = "reservation.offline"
subject = "Guest laptop"
until = 2026-12-31
reason = "temporary: away until the new year"
